# network-services/pihole/secret.yaml
# Senha do admin web do Pi-hole.
# Em produção: migrar para SealedSecret ou SOPS — esta é uma senha de lab.
#
# Aplicar: kubectl apply -f kubernetes/network-services/pihole/secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: pihole-admin
  namespace: network-services
  labels:
    app.kubernetes.io/name: "pihole"
    app.kubernetes.io/component: "secret"
