# edge/cloudflared/sealedsecret.yaml
# Seguro para commit — encryptedData só decripta com a chave privada do
# controller Sealed Secrets do cluster (namespace kube-system). Gerado a
# partir de secrets/env.cloudflared.enc.yaml (SOPS) via
# scripts/seal-secret.sh, scope strict (name+namespace precisam bater no
# apply). Ver docs/adr.md ADR-013 e secrets/README.md.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: cloudflared-credentials
  namespace: edge
spec:
  encryptedData:
    credentials.json: 
  template:
    metadata:
      name: cloudflared-credentials
      namespace: edge
