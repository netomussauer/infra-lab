apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgresql
  namespace: shared-infra
  labels:
    app.kubernetes.io/name: "postgresql"
    app.kubernetes.io/version: "16"
    app.kubernetes.io/component: "database"
    app.kubernetes.io/managed-by: "kubectl"
    environment: "lab"
    lab_id: "lab-k8s-01"
    lab_owner: "jose.mussauer"
spec:
  serviceName: postgresql
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: "postgresql"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: "postgresql"
        app.kubernetes.io/version: "16"
        app.kubernetes.io/component: "database"
        app.kubernetes.io/managed-by: "kubectl"
        environment: "lab"
        lab_id: "lab-k8s-01"
        lab_owner: "jose.mussauer"
    spec:
      terminationGracePeriodSeconds: 60

      nodeSelector:
        workload: "monitoring"

      securityContext:
        # PostgreSQL initdb requires root; fsGroup ensures the data volume
        # is writable by the postgres process (uid 70 in alpine image)
        fsGroup: 70
        runAsNonRoot: false

      containers:
        - name: postgresql
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP

          env:
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_DB
              value: "postgres"
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql-secret
                  key: POSTGRES_PASSWORD
            - name: REALTPMSYS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql-secret
                  key: REALTPMSYS_PASSWORD
            - name: AMFIT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql-secret
                  key: AMFIT_PASSWORD

          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
                - -d
                - postgres
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
            successThreshold: 1

          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
                - -d
                - postgres
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
            successThreshold: 1

          startupProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
                - -d
                - postgres
            # Allows up to 5 minutes for initdb to complete on first boot
            failureThreshold: 30
            periodSeconds: 10

          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true

      volumes:
        - name: initdb
          configMap:
            name: postgresql-initdb
            defaultMode: 0755

  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: "postgresql"
          environment: "lab"
          lab_id: "lab-k8s-01"
          lab_owner: "jose.mussauer"
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path
        resources:
          requests:
            storage: 10Gi
