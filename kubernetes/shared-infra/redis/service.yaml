apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: shared-infra
  labels:
    app.kubernetes.io/name: "redis"
    app.kubernetes.io/version: "7"
    app.kubernetes.io/component: "cache"
    app.kubernetes.io/managed-by: "kubectl"
    environment: "lab"
    lab_id: "lab-k8s-01"
    lab_owner: "jose.mussauer"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: "redis"
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      protocol: TCP
