apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: shared-infra
  labels:
    app.kubernetes.io/name: "redis"
    app.kubernetes.io/version: "7"
    app.kubernetes.io/component: "cache"
    app.kubernetes.io/managed-by: "kubectl"
    environment: "lab"
    lab_id: "lab-k8s-01"
    lab_owner: "jose.mussauer"
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: "redis"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: "redis"
        app.kubernetes.io/version: "7"
        app.kubernetes.io/component: "cache"
        app.kubernetes.io/managed-by: "kubectl"
        environment: "lab"
        lab_id: "lab-k8s-01"
        lab_owner: "jose.mussauer"
    spec:
      terminationGracePeriodSeconds: 60

      nodeSelector:
        workload: "monitoring"

      securityContext:
        runAsNonRoot: true
        runAsUser: 999   # redis user in the official alpine image
        fsGroup: 999

      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent

          # redis.conf is loaded from the ConfigMap; --requirepass injects the
          # password at runtime from the Secret to avoid it appearing in the config file.
          command:
            - redis-server
            - /etc/redis/redis.conf
            - --requirepass
            - $(REDIS_PASSWORD)

          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP

          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: REDIS_PASSWORD

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"

          readinessProbe:
            exec:
              command:
                - redis-cli
                - -a
                - $(REDIS_PASSWORD)
                - ping
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
            successThreshold: 1

          livenessProbe:
            exec:
              command:
                - redis-cli
                - -a
                - $(REDIS_PASSWORD)
                - ping
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
            successThreshold: 1

          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /etc/redis
              readOnly: true

      volumes:
        - name: config
          configMap:
            name: redis-config

  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: "redis"
          environment: "lab"
          lab_id: "lab-k8s-01"
          lab_owner: "jose.mussauer"
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path
        resources:
          requests:
            storage: 2Gi
