# Secret com a connection string usada pelo postgres_exporter.
#
# DATA_SOURCE_NAME formato libpq: postgres://user:pass@host:port/db?sslmode=...
# O usuário `postgres` (superuser) é o que dá acesso a pg_stat_statements de
# todos os databases via param `auto_discover_databases=true` no exporter.
#
# Aviso: este Secret tem a senha de superuser em base64 (não criptografado).
# Em produção, migrar para SealedSecret ou External Secrets Operator.
# No lab é aceitável porque o cluster é interno e o Secret só é montado
# como env var no pod do exporter (não exposto via Service).
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-exporter
  namespace: shared-infra
  labels:
    app.kubernetes.io/name: "postgres-exporter"
    app.kubernetes.io/component: "metrics-exporter"
    app.kubernetes.io/managed-by: "kubectl"
    environment: "lab"
    lab_id: "lab-k8s-01"
    lab_owner: "jose.mussauer"
type: Opaque
stringData:
  # Conecta ao DB postgres como superuser; o flag --auto-discover-databases
  # do exporter expande automaticamente para todos os DBs (realtpmsys, amfit, etc).
  DATA_SOURCE_NAME: "postgresql://postgres:postgres@postgresql.shared-infra.svc.cluster.local:5432/postgres?sslmode=disable"
