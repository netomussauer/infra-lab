# Service ClusterIP que expõe a porta /metrics do exporter.
# Targeting via ServiceMonitor (selector por label app.kubernetes.io/name).
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-exporter
  namespace: shared-infra
  labels:
    app.kubernetes.io/name: "postgres-exporter"
    app.kubernetes.io/component: "metrics-exporter"
    app.kubernetes.io/managed-by: "kubectl"
    environment: "lab"
    lab_id: "lab-k8s-01"
    lab_owner: "jose.mussauer"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: "postgres-exporter"
  ports:
    - name: metrics
      port: 9187
      targetPort: metrics
      protocol: TCP
