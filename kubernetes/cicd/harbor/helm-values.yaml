# cicd/harbor/helm-values.yaml
# Helm values para harbor/harbor chart
#
# Repositório: https://helm.goharbor.io
# Chart: harbor/harbor
#
# Instalar:
#   helm repo add harbor https://helm.goharbor.io
#   helm upgrade --install harbor harbor/harbor \
#     -f kubernetes/cicd/harbor/helm-values.yaml \
#     --namespace registry --create-namespace
#
# IP MetalLB alocado: 192.168.1.202
# Acesso: https://harbor.lab.local ou http://192.168.1.202
# Credenciais padrão: admin / Harbor12345! (alterar no primeiro login)

externalURL: "https://harbor.lab.local"

# Exposição via LoadBalancer MetalLB
expose:
  type: loadBalancer
  loadBalancer:
    IP: "192.168.1.202"
    ports:
      httpPort: 80
      httpsPort: 443
    annotations:
      metallb.universe.tf/address-pool: "lab-pool"
  tls:
    enabled: true
    # NUNCA voltar para "auto": o chart regenera a CA `harbor-ca` a cada `helm
    # upgrade`, e os nós (containerd) e pipelines deixam de confiar no Harbor
    # (incidente 2026-09-24, runbook P28). O certificado é estável: CA de 10 anos +
    # folha de 825 dias, em SealedSecret (harbor-tls-sealedsecret.yaml); CA pública
    # em harbor-ca.crt, chave da CA em secrets/harbor-ca.enc.yaml (SOPS).
    certSource: secret
    secret:
      secretName: "harbor-tls"

# Senha do admin Harbor
harborAdminPassword: "Harbor12345!"

# Chave secreta para encrypt de dados (16, 32 ou 64 chars)
secretKey: "labsecretkey1234"

# Persistência — todos os volumes via local-path
persistence:
  enabled: true
  resourcePolicy: "keep"

  persistentVolumeClaim:
    registry:
      storageClass: "local-path"
      accessMode: ReadWriteOnce
      size: "50Gi"
    jobservice:
      jobLog:
        storageClass: "local-path"
        accessMode: ReadWriteOnce
        size: "2Gi"
    database:
      storageClass: "local-path"
      accessMode: ReadWriteOnce
      size: "5Gi"
    redis:
      storageClass: "local-path"
      accessMode: ReadWriteOnce
      size: "2Gi"
    trivy:
      storageClass: "local-path"
      accessMode: ReadWriteOnce
      size: "5Gi"

# NodeSelector — roda no k3s-worker-cicd
nodeSelector:
  workload: "cicd"

# Resources por componente
# Perfil: ambiente de laboratório com 6GB RAM disponível no node cicd
nginx:
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "200m"
      memory: "128Mi"
  nodeSelector:
    workload: "cicd"
  livenessProbe:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 15
    failureThreshold: 3
    successThreshold: 1
    timeoutSeconds: 5
  readinessProbe:
    enabled: true
    initialDelaySeconds: 10
    periodSeconds: 10
    failureThreshold: 3
    successThreshold: 1
    timeoutSeconds: 5

portal:
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "200m"
      memory: "128Mi"
  nodeSelector:
    workload: "cicd"
  livenessProbe:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 15
    failureThreshold: 3
    successThreshold: 1
    timeoutSeconds: 5
  readinessProbe:
    enabled: true
    initialDelaySeconds: 10
    periodSeconds: 10
    failureThreshold: 3
    successThreshold: 1
    timeoutSeconds: 5

core:
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  nodeSelector:
    workload: "cicd"
  # timeoutSeconds explícito (padrão do chart = 1s): sob IO saturado no
  # k3s-worker-cicd o healthcheck estourava e o kubelet derrubava o core.
  # Ver docs/runbook.md P26/P27.
  livenessProbe:
    enabled: true
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1
  readinessProbe:
    enabled: true
    initialDelaySeconds: 20
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1
  startupProbe:
    enabled: true
    initialDelaySeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30
    periodSeconds: 10

jobservice:
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"
  nodeSelector:
    workload: "cicd"
  jobLoggers:
    - file
  loggerSweeperDuration: 14    # dias
  livenessProbe:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 15
    failureThreshold: 3
    successThreshold: 1
    timeoutSeconds: 5
  readinessProbe:
    enabled: true
    initialDelaySeconds: 20
    periodSeconds: 10
    failureThreshold: 3
    successThreshold: 1
    timeoutSeconds: 5

registry:
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  nodeSelector:
    workload: "cicd"
  livenessProbe:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 15
    failureThreshold: 3
    successThreshold: 1
    timeoutSeconds: 5
  readinessProbe:
    enabled: true
    initialDelaySeconds: 20
    periodSeconds: 10
    failureThreshold: 3
    successThreshold: 1
    timeoutSeconds: 5
  controller:
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        cpu: "200m"
        memory: "128Mi"

trivy:
  enabled: true
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  nodeSelector:
    workload: "cicd"

# Faltava nodeSelector aqui — sem ele o scheduler já colocou o pod no
# raspneto (único worker ARM do lab), e a imagem do exporter só existe
# para amd64: "exec format error" em CrashLoopBackOff (ver
# context/facts, incidente 2026-09-14). Todos os outros componentes do
# chart já fixam workload=cicd; este ficou de fora por omissão.
exporter:
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "200m"
      memory: "128Mi"
  nodeSelector:
    workload: "cicd"

database:
  type: internal
  internal:
    # 512Mi crash-loopava sob carga de build concorrente (core+registry+
    # jobservice batendo no Postgres ao mesmo tempo): "database system was
    # interrupted" / exit 141 nos logs do harbor-database-0. Dobrado.
    resources:
      requests:
        cpu: "150m"
        memory: "384Mi"
      limits:
        cpu: "750m"
        memory: "1Gi"
    # Movido do k3s-worker-cicd para o worker do pve2 (SSD) em 2026-09-24: os
    # builds kaniko saturam o disco do nó cicd e derrubavam o banco (P27). O
    # PVC local-path nasce no nó onde o pod é agendado; blobs das imagens
    # continuam no PVC harbor-registry, no nó cicd.
    nodeSelector:
      kubernetes.io/hostname: "k3s-worker-pve2"
    # 16 restarts (exit 137) em 9 dias: o healthcheck (`/docker-healthcheck.sh`)
    # com timeout de 1s falha quando o disco do k3s-worker-cicd satura (builds
    # kaniko no mesmo nó); o kubelet mata o Postgres, que leva > 1 min para
    # desligar ("the database system is shutting down") e acaba com SIGKILL —
    # e o token service do Harbor fica fora, quebrando o push (401/redirects).
    # 6 falhas x 10s com timeout de 10s tolera um engasgo de IO sem matar o banco.
    livenessProbe:
      initialDelaySeconds: 300
      periodSeconds: 10
      timeoutSeconds: 10
      failureThreshold: 6
      successThreshold: 1
    readinessProbe:
      initialDelaySeconds: 1
      periodSeconds: 10
      timeoutSeconds: 10
      failureThreshold: 6
      successThreshold: 1

redis:
  type: internal
  internal:
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        cpu: "200m"
        memory: "128Mi"
    nodeSelector:
      workload: "cicd"
    livenessProbe:
      initialDelaySeconds: 300
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 6
      successThreshold: 1
    readinessProbe:
      initialDelaySeconds: 1
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 6
      successThreshold: 1

# Labels globais aplicadas a todos os recursos
commonLabels:
  environment: "lab"
  lab_id: "lab-k8s-01"
  lab_owner: "jose.mussauer"

# Métricas Prometheus
metrics:
  enabled: true
  serviceMonitor:
    enabled: false   # habilitar se kube-prometheus-stack já estiver instalado

# Configurações de log
logLevel: info

# Update strategy
updateStrategy:
  type: RollingUpdate
