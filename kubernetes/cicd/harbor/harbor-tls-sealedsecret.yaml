# kubernetes/cicd/harbor/harbor-tls-sealedsecret.yaml
# Certificado TLS ESTAVEL do Harbor (CA harbor-ca de 10 anos + folha de 825 dias, SAN
# harbor.lab.local e 192.168.1.202). Gerado do zero em 2026-09-24 — substitui o certSource:
# auto, que regenerava a CA a cada helm upgrade (runbook P28). Seguro para commit (SealedSecret,
# scope strict). A chave da CA fica em secrets/harbor-ca.enc.yaml (SOPS); a CA publica em
# harbor-ca.crt (mesmo diretorio).
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: harbor-tls
  namespace: registry
spec:
  encryptedData:
    ca.crt: 
    tls.crt: 
    tls.key: 
  template:
    metadata:
      name: harbor-tls
      namespace: registry
