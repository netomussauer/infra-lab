---
# 07-k3s-registries.yml
# Instala o CA do Harbor no trust store de cada nó para que containerd valide
# o certificado autoassinado do Harbor durante image pull.
#
# Problema: Harbor do lab serve HTTPS com cert autoassinado pelo CA `harbor-ca`.
# `containerd` valida TLS contra o trust store do SO de cada nó (não contra
# certs.d/ por questões de geração de hosts.toml em formato legacy no K3s v1.29).
# Resultado: image pulls de `harbor.lab.local/*` falham com
# `x509: certificate signed by unknown authority`.
#
# Solução (Opção B do amfit/infra/cluster/PENDING.md item 1.1):
#   1. Ler o CA PÚBLICO estável do repo (kubernetes/cicd/harbor/harbor-ca.crt) —
#      desde 2026-09-24 o Harbor usa certSource: secret com CA fixa (runbook P28);
#      antes o CA era extraído do secret `harbor-nginx` e mudava a cada helm upgrade.
#   2. Copiar para /usr/local/share/ca-certificates/harbor-ca.crt em cada nó
#   3. Rodar `update-ca-certificates`
#   4. Reiniciar k3s / k3s-agent para containerd recarregar o trust store
#
# Para atualizar nó a nó (recomendado — o restart do k3s afeta cada nó):
#   ansible-playbook playbooks/07-k3s-registries.yml --limit k3s-worker-cicd
# Sobrescrever StrictHostKeyChecking (o ansible.cfg do repo o desliga) com
#   -e 'ansible_ssh_common_args="-o StrictHostKeyChecking=accept-new"'
# se quiser manter a verificação de chave de host.
#
# Esta abordagem é mais correta que `insecure_skip_verify: true` em
# registries.yaml (Opção A) — mantém a validação TLS, apenas adiciona o CA
# interno ao trust store do SO.
#
# Aplicar:
#   ansible-playbook -i inventory/hosts.yml playbooks/07-k3s-registries.yml
#
# Validar (em qualquer nó):
#   sudo crictl pull harbor.lab.local/amfit/api:latest   # deve funcionar sem TLS error

- name: Instalar CA do Harbor em todos os nós K3s
  hosts: k3s_server:k3s_agents
  become: true
  gather_facts: true
  vars:
    # CA pública estável, versionada no repo (a chave fica em SOPS, fora daqui).
    harbor_ca_pem: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../../kubernetes/cicd/harbor/harbor-ca.crt') }}"
  pre_tasks:
    - name: Validar que o CA do repo é um certificado PEM com CN harbor-ca
      ansible.builtin.assert:
        that:
          - "'BEGIN CERTIFICATE' in harbor_ca_pem"
          - "'END CERTIFICATE' in harbor_ca_pem"
        fail_msg: "kubernetes/cicd/harbor/harbor-ca.crt inválido"
      delegate_to: localhost
      become: false
      run_once: true

  tasks:
    # ----------------------------------------------------------------
    # Limpeza: remover registries.yaml legado (caso a Opção A tenha sido
    # tentada antes — K3s o gera em formato que não honra skip_verify).
    # ----------------------------------------------------------------
    - name: Remover /etc/rancher/k3s/registries.yaml legado
      ansible.builtin.file:
        path: /etc/rancher/k3s/registries.yaml
        state: absent
      notify:
        - Reiniciar K3s server
        - Reiniciar K3s agent

    # ----------------------------------------------------------------
    # Instalar CA no trust store do SO
    # ----------------------------------------------------------------
    - name: Copiar CA do Harbor para /usr/local/share/ca-certificates
      ansible.builtin.copy:
        dest: /usr/local/share/ca-certificates/harbor-ca.crt
        owner: root
        group: root
        mode: "0644"
        content: "{{ harbor_ca_pem }}"
      notify:
        - Atualizar trust store
        - Reiniciar K3s server
        - Reiniciar K3s agent

    - name: Forçar handlers (flush) — trust store antes do restart
      ansible.builtin.meta: flush_handlers

    - name: Aguardar 10s para K3s estabilizar após restart
      ansible.builtin.pause:
        seconds: 10

    # ----------------------------------------------------------------
    # Validação
    # ----------------------------------------------------------------
    - name: Validar que o CA está no bundle do SO
      ansible.builtin.shell: |
        awk -v cmd='openssl x509 -noout -subject' '
          /BEGIN/{close(cmd)};{print | cmd}
        ' /etc/ssl/certs/ca-certificates.crt | grep -q "harbor-ca"
      register: ca_in_bundle
      changed_when: false
      failed_when: ca_in_bundle.rc != 0

    - name: Validar handshake TLS contra Harbor sem -k
      # Sem -k = curl valida TLS contra o trust store. Se passar, containerd
      # também passará. Aceita HTTP 401 (auth obrigatória) — só o handshake importa.
      ansible.builtin.shell: |
        curl -s -o /dev/null -w "%{http_code}" \
          --connect-timeout 5 --max-time 10 \
          https://harbor.lab.local/v2/
      register: tls_check
      changed_when: false
      failed_when: tls_check.stdout not in ['200', '401']

    - name: Exibir resultado
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: Harbor TLS OK (HTTP {{ tls_check.stdout }})"

  handlers:
    - name: Atualizar trust store
      ansible.builtin.command:
        cmd: update-ca-certificates
      changed_when: true

    - name: Reiniciar K3s server
      when: "'k3s_server' in group_names"
      ansible.builtin.systemd:
        name: k3s
        state: restarted

    - name: Reiniciar K3s agent
      when: "'k3s_agents' in group_names"
      ansible.builtin.systemd:
        name: k3s-agent
        state: restarted
