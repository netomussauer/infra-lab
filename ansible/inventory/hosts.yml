# Inventário estático do cluster K3s do laboratório home-lab.
#
# Grupos:
#   k3s_server  — nó control-plane (única VM com a API do K3s)
#   k3s_agents  — todos os nós worker (VMs + bare metal)
#   k3s_cluster — grupo de conveniência que agrega server + agents
#
# Nós bare metal (ubuntu-neto, raspneto) não são gerenciados pelo Terraform,
# mas participam do cluster como workers via Ansible.
#
# ATENÇÃO: o nome do host no inventário DEVE ser o nome do nó no K3s (hostname do
# SO) — os playbooks usam {{ inventory_hostname }} em `kubectl get/label node`.
# Renomeados em 2026-09-24: notebook-i5 -> ubuntu-neto (IP .65 -> .67 após o crash
# de 2026-06) e raspberry-pi -> raspneto.

all:
  children:

    # -------------------------------------------------------------------------
    # Control-plane do K3s
    # -------------------------------------------------------------------------
    k3s_server:
      hosts:
        k3s-server:
          ansible_host: 192.168.1.30

    # -------------------------------------------------------------------------
    # Workers do K3s
    # -------------------------------------------------------------------------
    k3s_agents:
      hosts:
        k3s-worker-cicd:
          ansible_host: 192.168.1.31

        ci-runner:
          ansible_host: 192.168.1.32

        # VM em pve2 (segundo host Proxmox) — nó de alivio de carga, sem afinidade fixa
        k3s-worker-pve2:
          ansible_host: 192.168.1.33
          k3s_node_label: "workload=general"

        # Bare metal (notebook) — Ubuntu 24.04, label workload=monitoring
        ubuntu-neto:
          ansible_host: 192.168.1.67
          k3s_node_label: "workload=monitoring"
          baremetal_init_user: netomussauer    # usuário local do proprietário

        # Bare metal — Raspbian 12, ARMv7. Requer binário k3s para arm
        raspneto:
          ansible_host: 192.168.1.110
          k3s_node_arch: arm
          k3s_node_label: "workload=edge"
          baremetal_init_user: mussa

    # -------------------------------------------------------------------------
    # Grupo completo do cluster (server + agents)
    # -------------------------------------------------------------------------
    k3s_cluster:
      children:
        k3s_server:
        k3s_agents:

    # -------------------------------------------------------------------------
    # Hosts físicos do laboratório (para tasks de manutenção geral)
    # -------------------------------------------------------------------------
    lab_physical:
      hosts:
        notebook-i7:
          ansible_host: 192.168.1.20
          ansible_user: root
          # Host Proxmox — gerenciado diretamente como root
        ubuntu-neto:
          ansible_host: 192.168.1.67
          baremetal_init_user: netomussauer
        raspneto:
          ansible_host: 192.168.1.110
          k3s_node_arch: arm
          baremetal_init_user: mussa
