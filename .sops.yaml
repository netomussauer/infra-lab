# .sops.yaml — regras de encriptação com age
# Ver: https://github.com/getsops/sops
#
# Recipients (public keys age) autorizadas a decriptar secrets/*.enc.yaml:
#   - age1x83mn... : wsl-netomussauer (WSL Ubuntu — host principal do lab)
#   - age1594lm... : netomussauer@DESKTOP-IH7A3QA (desktop Windows)
#
# ADICIONAR NOVO HOST:
#   1. No host novo: age-keygen -o ~/.config/sops/age/keys.txt
#   2. Anexa a public key abaixo com vírgula separando (uma por linha,
#      mesma indentação, TODAS no mesmo bloco 'age: >-'). NÃO usar lista
#      YAML (- age1...); NÃO por comentário dentro do bloco >-.
#   3. Rekey (dono do repo):    sops updatekeys secrets/*.enc.yaml
#   4. Commit + push. Host novo faz `git pull && ./scripts/secrets-refresh.sh`
#
# REVOGAR HOST:
#   1. Remove a linha da public key deste bloco `age:`
#   2. sops updatekeys secrets/*.enc.yaml
#   3. Commit + push
#   4. Rotacione os valores em si (tokens, senhas) — a chave privada
#      revogada ainda descripta cópias antigas cacheadas no host caso
#      não tenham sido apagadas.

creation_rules:
  - path_regex: secrets/.+\.enc\.yaml$
    encrypted_regex: "^(data|stringData)$"
    age: >-
      age1x83mnv7zg8rjqvz3n2dvz3vm9j6h8e7p96rjct8cxaxrqa8nxfqqxwcesy,
      age1594lm46k4ye5664gx09qc0lvlw6ywck0hyx3dmwcd2gz028jsdss0xtl3m
